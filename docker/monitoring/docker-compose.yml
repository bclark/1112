services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    user: "0:0"
    ports:
      - "9090:9090"
    volumes:
      - /volume1/docker/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /volume1/docker/monitoring/prometheus/data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    user: "0:0"
    ports:
      - "3001:3000"
    environment:
      - TZ=America/New_York
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=technodrome
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=false
      - GF_AUTH_PROXY_WHITELIST=127.0.0.1, ::1
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/karai-llm.json
    volumes:
      - /volume1/docker/monitoring/grafana/data:/var/lib/grafana
      - /volume1/docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

  grafana-kiosk:
    build: ./kiosk
    container_name: grafana-kiosk
    restart: unless-stopped
    depends_on:
      - grafana
    network_mode: "service:grafana"
    shm_size: "1gb"
    environment:
      - TZ=America/New_York
      - DISPLAY=:0
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /tmp:/host-tmp:ro

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
      - "--web.listen-address=0.0.0.0:9100"
