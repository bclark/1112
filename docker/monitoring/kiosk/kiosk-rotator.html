<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Technodrome HDMI Telemetry Kiosk</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      cursor: none !important;
    }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #111217;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .deck {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    iframe {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.45s ease-in-out;
      z-index: 1;
    }
    iframe.active {
      opacity: 1;
      z-index: 2;
    }
    .hud {
      position: fixed;
      bottom: 8px;
      right: 12px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(17, 18, 23, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #d8d9da;
      font-size: 11px;
      letter-spacing: 0.03em;
      backdrop-filter: blur(6px);
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #73bf69;
      box-shadow: 0 0 6px #73bf69;
    }
    .progress-track {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      height: 2px;
      background: rgba(255, 255, 255, 0.05);
      z-index: 10;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #5794f2, #73bf69);
      transition: width 0.25s linear;
    }
  </style>
</head>
<body>
  <div class="deck">
    <iframe
      id="frame-0"
      class="active"
      src="/d/karai-llm-telemetry/karai-llama-cpp-and-rtx-5070-telemetry?kiosk&orgId=1&refresh=5s"
    ></iframe>
    <iframe
      id="frame-1"
      src="/d/technodrome-nas-telemetry/technodrome-nas-system-and-storage-telemetry?kiosk&orgId=1&refresh=5s"
    ></iframe>
  </div>

  <div class="hud">
    <span class="dot"></span>
    <span id="hud-label">1/2 • Karai AI &amp; RTX 5070</span>
  </div>
  <div class="progress-track">
    <div id="progress-bar" class="progress-bar"></div>
  </div>

  <script>
    const INTERVAL_MS = 30000;
    const slides = [
      { id: "frame-0", label: "1/2 • Karai AI & RTX 5070" },
      { id: "frame-1", label: "2/2 • Technodrome NAS" }
    ];
    let current = 0;
    let startTime = Date.now();

    const hudLabel = document.getElementById("hud-label");
    const progressBar = document.getElementById("progress-bar");

    function tick() {
      const elapsed = Date.now() - startTime;
      if (elapsed >= INTERVAL_MS) {
        document.getElementById(slides[current].id).classList.remove("active");
        current = (current + 1) % slides.length;
        document.getElementById(slides[current].id).classList.add("active");
        hudLabel.textContent = slides[current].label;
        startTime = Date.now();
        progressBar.style.width = "0%";
      } else {
        const pct = Math.min(100, (elapsed / INTERVAL_MS) * 100);
        progressBar.style.width = pct.toFixed(1) + "%";
      }
      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  </script>
</body>
</html>
